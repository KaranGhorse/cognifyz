<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Task 2 - Cognifyz (Interactive)</title>
    <style>
   
      body {
        font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        background: linear-gradient(135deg, #74ebd5, #acb6e5);
        display: flex;
        justify-content: center;
        align-items: center;
        height: 100vh;
        margin: 0;
      }

 
      .form-container {
        background: white;
        padding: 30px;
        border-radius: 12px;
        box-shadow: 0 8px 20px rgba(0, 0, 0, 0.2);
        width: 320px;
        transition: transform 0.3s;
      }

      /* Hover effect on the whole card */
      .form-container:hover {
        transform: translateY(-5px);
      }

      h2 {
        text-align: center;
        color: #333;
        margin-bottom: 20px;
      }

      .input-group {
        margin-bottom: 15px;
        position: relative;
      }

      label {
        display: block;
        margin-bottom: 5px;
        color: #555;
        font-weight: 600;
      }

      /* Input styling */
      input {
        width: 100%;
        padding: 10px;
        border: 2px solid #ddd;
        border-radius: 6px;
        box-sizing: border-box;
        transition: border-color 0.3s;
        outline: none;
      }

    
      input:focus {
        border-color: #4CAF50;
      }

    
      input.error {
        border-color: #ff4d4d;
      }

     
      .error-msg {
        color: #ff4d4d;
        font-size: 12px;
        margin-top: 5px;
        display: none; 
      }

      
      button {
        width: 100%;
        padding: 12px;
        background: #4CAF50;
        color: white;
        border: none;
        border-radius: 6px;
        font-size: 16px;
        cursor: pointer;
        transition: background 0.3s, transform 0.2s;
        font-weight: bold;
      }

     
      button:hover {
        background: #45a049;
        transform: scale(1.02);
      }

      button:active {
        transform: scale(0.98);
      }
    </style>
  </head>
  <body>

    <div class="form-container">
      <h2>Create Account</h2>
      <form id="regForm" action="/submit" method="POST">
        
        <div class="input-group">
          <label for="name">Name</label>
          <input type="text" id="name" name="name" placeholder="Enter your full name" />
          <small class="error-msg">Name cannot be empty</small>
        </div>

        <div class="input-group">
          <label for="email">Email</label>
          <input type="text" id="email" name="email" placeholder="example@email.com" />
          <small class="error-msg">Valid email is required</small>
        </div>

        <div class="input-group">
          <label for="password">Password</label>
          <input type="password" id="password" name="password" placeholder="Min. 6 characters" />
          <small class="error-msg">Password must be at least 6 characters</small>
        </div>

        <button type="submit">Sign Up</button>
      </form>
    </div>

    <script>
      const form = document.getElementById('regForm');
      const nameInput = document.getElementById('name');
      const emailInput = document.getElementById('email');
      const passInput = document.getElementById('password');

      form.addEventListener('submit', function(e) {
        let isValid = true;
        
        // Reset old errors
        resetErrors();

        // Validate Name
        if (nameInput.value.trim() === "") {
          showError(nameInput, "Name cannot be empty");
          isValid = false;
        }

        // Validate Email
        if (emailInput.value.trim() === "" || !emailInput.value.includes('@')) {
          showError(emailInput, "Please enter a valid email");
          isValid = false;
        }

        // Validate Password
        if (passInput.value.length < 6) {
          showError(passInput, "Password must be at least 6 characters");
          isValid = false;
        }

        // Agar form valid nahi hai, to submit hone se roko
        if (!isValid) {
          e.preventDefault(); 
        }
      });

      // Helper function to show error
      function showError(input, message) {
        const inputGroup = input.parentElement;
        const errorMsg = inputGroup.querySelector('.error-msg');
        
        input.classList.add('error'); // Red border add karega
        errorMsg.style.display = 'block'; // Error text dikhayega
        errorMsg.innerText = message;
      }

      // Helper function to clear errors
      function resetErrors() {
        const inputs = document.querySelectorAll('input');
        const errors = document.querySelectorAll('.error-msg');

        inputs.forEach(input => input.classList.remove('error'));
        errors.forEach(error => error.style.display = 'none');
      }
      
 
      [nameInput, emailInput, passInput].forEach(input => {
        input.addEventListener('input', () => {
             if(input.classList.contains('error')){
                 input.classList.remove('error');
                 input.parentElement.querySelector('.error-msg').style.display = 'none';
             }
        });
      });
    </script>
  </body>
</html>

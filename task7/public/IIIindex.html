<!DOCTYPE html>
<html>
<head>
  <title>Weather App</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="bg-light">

<div class="container mt-5">
  <div class="card p-4 shadow">

    <h2 class="text-center mb-3">🌦 Weather Application</h2>

    <!-- Login Section -->
    <div id="loginSection" class="text-center mb-3">
      <a href="/auth/google" class="btn btn-danger">Login with Google</a>
    </div>

    <!-- User Section -->
    <div id="userSection" class="text-center mb-3 d-none">
      <h5 id="userName"></h5>
      <a href="/auth/logout" class="btn btn-outline-danger btn-sm">Logout</a>
    </div>

    <!-- Weather Section -->
    <div id="weatherSection" class="d-none">

      <div class="input-group mb-3">
        <input id="city" class="form-control" placeholder="Enter city name">
        <button onclick="getWeather()" class="btn btn-primary">Get Weather</button>
      </div>

      <div id="result" class="text-center"></div>

    </div>

  </div>
</div>

<script>
async function checkLogin() {
  const res = await fetch('/auth/user');
  const user = await res.json();

  if (user) {
    document.getElementById('loginSection').classList.add('d-none');
    document.getElementById('userSection').classList.remove('d-none');
    document.getElementById('weatherSection').classList.remove('d-none');

    document.getElementById('userName').innerText = `Welcome, ${user.name}`;
  }
}

checkLogin();

async function getWeather() {
  const city = document.getElementById("city").value;

  const res = await fetch(`/api/weather/${city}`);
  const data = await res.json();

  document.getElementById("result").innerHTML = `
    <h4>${data.name}</h4>
    <p>🌡 Temp: ${(data.main.temp - 273.15).toFixed(1)}°C</p>
    <p>🌤 Weather: ${data.weather[0].description}</p>
  `;
}

</script>

</body>
</html>
